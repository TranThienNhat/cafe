version: '3.8'

services:
  # 1. Database Service: MySQL 8.0
  mysql_db:
    image: mysql:8.0
    container_name: smart_coffee_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "password123"
      MYSQL_DATABASE: "smart_coffee_db"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./smart_coffee_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword123"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Backend Service: Flask RESTful API & AI Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_coffee_backend
    restart: always
    environment:
      - FLASK_ENV=production
      - DB_HOST=mysql_db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=password123
      - DB_NAME=smart_coffee_db
      - JWT_SECRET_KEY=smart_coffee_super_secret_jwt_key_2026_sontay
    ports:
      - "5000:5000"
    depends_on:
      mysql_db:
        condition: service_healthy

  # 3. Frontend Service: React Vite + Nginx Web Server
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart_coffee_frontend
    restart: always
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
    driver: local
